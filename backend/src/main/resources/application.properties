spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=validate
# Com o mapeamento para DTO acontecendo dentro dos @Transactional dos Services,
# o open-in-view deixa de ser necessário — e mantê-lo ligado esconderia N+1
# atrás de lazy loading na serialização.
spring.jpa.open-in-view=false
# Resolve as coleções LAZY de todos os registros de uma página em poucos selects
# com IN (...), em vez de um select por registro.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# O dialeto explícito foi removido: desde o Hibernate 6 ele é detectado a partir da
# conexão, e fixá-lo desliga a resolução version-aware (Hibernate 7 desencoraja).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Teto de page size: sem isso, ?size=1000000 obriga o banco a materializar tudo.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20
server.port=8080
jwt.expiration-ms=86400000
app.upload.dir=${user.home}/lms-uploads
app.upload.base-url=http://localhost:8080
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
