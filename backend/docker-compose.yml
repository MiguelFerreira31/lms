services:
  db:
    image: postgres:18
    container_name: lms-postgres
    environment:
      POSTGRES_DB: lmsdb
      POSTGRES_USER: ${DB_USERNAME:-lms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "5433:5432"
    volumes:
      # A imagem do Postgres 18 mudou o ponto de montagem recomendado:
      # /var/lib/postgresql (e não mais /var/lib/postgresql/data). Ele coloca os
      # dados num subdiretório, o que permite usar `pg_upgrade --link` em upgrades
      # futuros sem esbarrar no limite do mount point.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
